# Docker 本地部署编排文件
# 敏感信息（数据库密码等）全部通过 ${VAR} 从根目录 .env 读取，不会写死在此文件中
name: fullstack

services:
  # ===== MySQL 数据库 =====
  mysql:
    image: mysql:8.4
    container_name: fullstack-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Shanghai
    # 注意：宿主机映射端口如与本机 MySQL 冲突，可在此调整；
    # 容器内部始终使用 3306，后端通过 docker 网络访问，不受宿主机端口影响
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次启动自动执行数据库初始化脚本（脚本内自含建库/建表/示例数据）
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ===== 后端服务 =====
  backend:
    build:
      context: ./server
    container_name: fullstack-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    ports:
      - "3000:3000"

  # ===== 前端服务（nginx 托管静态资源 + 反向代理 API）=====
  frontend:
    build:
      context: ./client
    container_name: fullstack-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  # MySQL 数据持久化卷：删除容器不清空数据
  mysql_data: